[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gphotos-cleanup"
version = "0.1.0"
description = "Download Google Photos locally and then move them to trash."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
gphotos-cleanup = "gphotos_cleanup.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
