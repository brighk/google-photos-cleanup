[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gphotos-cleanup"
version = "0.1.0"
description = "Download Google Photos locally and then move them to trash."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
]

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pyright>=1.1.400",
  "pytest>=8,<9",
  "ruff>=0.12",
]

[project.scripts]
gphotos-cleanup = "gphotos_cleanup.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
  "ASYNC",
  "RUF",
]
# Small synchronous file writes (state JSON, failure log) on the single
# event-loop thread are intentional.
ignore = ["ASYNC240"]

[tool.ruff.lint.isort]
# The code sorts `import x` and `from x import y` together by module name.
force-sort-within-sections = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
